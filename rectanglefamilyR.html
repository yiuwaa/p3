<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長方形尋親記 — 互動故事書</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --ink: #2b2b2b;
  --pink: #ff7f50;
  --blue: #4fa3ff;
  --purple: #9b6bff;
  --yellow: #ffd93d;
  --green: #6bd66b;
  --paper: #fffdf7;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Noto Sans TC", "PingFangTC", "Microsoft JhengHei", sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, #cde8ff 0%, #eef7ff 45%, #d1f4e0 100%);
  min-height: 100vh;
}
#app {
  max-width: 960px;
  margin: 0 auto;
  padding: 14px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
header h1 { font-size: 1.35rem; margin: 0; color: #1e3a8a; font-weight: 800; }
.tools { display: flex; gap: 8px; align-items: center; }
.tools button {
  border: none;
  background: #fff;
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
  transition: transform 0.15s, background-color 0.15s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.tools button:hover { transform: translateY(-2px); background-color: #e0f2fe; }

/* 頂部可點擊進度圓圈 */
.progress { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.progress button.prog-dot {
  width: 28px;
  height: 28px;
  padding: 0;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #2563eb;
  color: #1e3a8a;
  font-size: 0.78rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.progress button.prog-dot:hover {
  transform: scale(1.15);
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
}
.progress button.prog-dot.done { background: #2563eb; color: #fff; }
.progress button.prog-dot.cur {
  background: #ffd93d;
  border-color: #d97706;
  color: #2b2b2b;
  transform: scale(1.2);
  box-shadow: 0 2px 8px rgba(217, 119, 6, 0.4);
}

.book {
  background: var(--paper);
  border-radius: 26px;
  padding: 22px;
  box-shadow: 0 10px 30px rgba(30,58,138,.18);
  border: 6px solid #fff;
  animation: pop 0.4s ease;
}
@keyframes pop {
  from { opacity: 0; transform: translateY(14px) scale(0.98); }
  to { opacity: 1; transform: none; }
}

.pagetitle {
  font-size: 1.5rem;
  margin: 0 0 12px;
  color: #1e3a8a;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
}
.scene {
  border-radius: 20px;
  padding: 18px 14px 8px;
  margin: 12px 0;
  position: relative;
  overflow: visible;
}
.village { background: linear-gradient(180deg, #dff3ff 0%, #dff3ff 65%, #b8e6a3 65%); }
.road    { background: linear-gradient(180deg, #e6f6ff 0%, #e6f6ff 60%, #e8d3a5 60%); }
.valley  { background: linear-gradient(180deg, #fff2d8 0%, #fff2d8 60%, #c9e2ff 60%); }
.hill    { background: linear-gradient(180deg, #ffe9f2 0%, #ffe9f2 60%, #b5d99c 60%); }
.home    { background: linear-gradient(180deg, #fff6d5 0%, #fff6d5 62%, #f5c9a0 62%); }

.stage {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 24px;
  flex-wrap: wrap;
  min-height: 200px;
}
.chara { margin: 0; text-align: center; animation: float 3s ease-in-out infinite; }
.chara:nth-child(2) { animation-delay: 0.6s; }
.chara:nth-child(3) { animation-delay: 1.2s; }
.chara svg { overflow: visible; filter: drop-shadow(0 6px 4px rgba(0,0,0,.18)); }
.chara figcaption {
  font-weight: 700;
  margin-top: 6px;
  background: #fff;
  border-radius: 999px;
  padding: 4px 14px;
  display: inline-block;
  box-shadow: 0 2px 5px rgba(0,0,0,.1);
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.wiggle { animation: wiggle 0.7s ease-in-out infinite !important; }
@keyframes wiggle {
  0%, 100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}

.bubble {
  background: #fff;
  border: 3px solid var(--ink);
  border-radius: 18px;
  padding: 12px 16px;
  position: relative;
  margin: 12px 0;
  font-size: 1.1rem;
  line-height: 1.65;
}
.bubble::after {
  content: "";
  position: absolute;
  left: 34px;
  bottom: -16px;
  border: 9px solid transparent;
  border-top-color: var(--ink);
}
.bubble b { color: #1d6fd6; }
.narr { font-size: 1.15rem; line-height: 1.8; margin: 10px 0; }
.letter {
  background: #f0f9ff;
  border: 2px dashed #0284c7;
  border-radius: 14px;
  padding: 16px 20px;
  font-size: 1.1rem;
  line-height: 1.8;
  transform: rotate(-1deg);
  box-shadow: 3px 4px 0 #bae6fd;
}
.card-checklist {
  list-style: none;
  padding: 0;
  margin: 10px 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.card-checklist li {
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 700;
  background: #fff;
  border: 2px solid #ccc;
}
.card-checklist li.y { border-color: #2e9e4f; color: #1f7a3a; background: #e9f9ee; }
.card-checklist li.n { border-color: #d33; color: #b22; background: #fdeaea; }

.feat-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 12px 0; }
.feat-btns button, .btn {
  font-size: 1.05rem;
  padding: 10px 18px;
  border-radius: 14px;
  border: 3px solid #1e3a8a;
  background: #fff;
  cursor: pointer;
  transition: 0.15s;
  font-family: inherit;
  font-weight: 700;
  min-height: 48px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.feat-btns button:hover, .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.15); }
.feat-btns button.on { background: #bae6fd; border-color: #0284c7; }

.quiz-card {
  background: #e0f2fe;
  border-radius: 18px;
  padding: 16px;
  margin: 14px 0;
  border: 3px solid #7dd3fc;
}
.quiz-card h3 { margin: 0 0 10px; font-size: 1.15rem; color: #1e3a8a; font-weight: 800; }
.choices-container { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; }
.choice-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 16px;
  border: 3px solid #1e3a8a;
  background: #fff;
  cursor: pointer;
  transition: 0.15s;
  text-align: left;
  font-size: 1.05rem;
  font-weight: 600;
  min-height: 52px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.choice-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.1); }
.choice-btn.sel-correct { background: #d9f7e1; border-color: #2e9e4f; }
.choice-btn.sel-wrong { background: #fde2e2; border-color: #d33; opacity: 0.75; }

.badge-box {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  font-size: 1.25rem;
  font-weight: 900;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}
.badge-A { background: #e63946; }
.badge-B { background: #1d6fd6; }
.badge-C { background: #d97706; }
.badge-D { background: #059669; }

.fb { display: none; padding: 12px 16px; border-radius: 12px; margin-top: 10px; font-size: 1.05rem; line-height: 1.6; }
.fb.show { display: block; animation: pop 0.3s; }
.fb.ok { background: #e0f7e6; border: 2px solid #2e9e4f; }
.fb.no { background: #fff1d6; border: 2px solid #e6a800; }

/* 家族包含關係大圈小圈 */
.nest { border-radius: 26px; padding: 16px; margin: 10px auto; position: relative; text-align: center; animation: pop 0.5s both; }
.nest .lbl { font-weight: 800; font-size: 1.05rem; display: block; margin-bottom: 6px; }
.nest small { display: block; font-weight: 600; font-size: 0.92rem; color: #333; margin-top: 4px; }
.n1 { background: #e9ddff; border: 3px solid #9b6bff; max-width: 540px; }
.n2 { background: #d7e9ff; border: 3px solid #4fa3ff; max-width: 440px; }
.n3 { background: #ffdccc; border: 3px solid #ff7f50; max-width: 340px; }

.rule { background: #fff; border-left: 8px solid #2563eb; padding: 12px 16px; border-radius: 10px; margin: 10px 0; font-size: 1.1rem; line-height: 1.7; }
.rule.warn { border-color: #e6a800; background: #fff8e1; }
.path { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.path button { flex: 1; min-width: 220px; padding: 18px; font-size: 1.15rem; border-radius: 18px; }

.next-btn {
  display: block;
  margin: 18px auto 0;
  background: #ffd93d;
  border-color: #d97706;
  font-size: 1.2rem;
  padding: 12px 36px;
  font-weight: 800;
}
.hidden { display: none !important; }
.score { font-weight: 800; color: #1e3a8a; font-size: 1.4rem; }
.confetti { position: fixed; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: fall linear forwards; z-index: 99; pointer-events: none; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (max-width: 600px) {
  .book { padding: 14px; border-radius: 20px; }
  .pagetitle { font-size: 1.3rem; }
  .stage { gap: 12px; min-height: 160px; }
  .progress button.prog-dot { width: 25px; height: 25px; font-size: 0.72rem; }
}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>📘 長方形尋親記</h1>
    <div class="progress" id="prog"></div>
    <div class="tools">
      <button type="button" id="readBtn" title="朗讀本頁">🔊 朗讀</button>
      <button type="button" id="homeBtn" title="返回封面">🏠 封面</button>
    </div>
  </header>

  <main class="book" id="page"></main>

  <footer class="text-center text-xs text-gray-600 mt-4">
    香港小三數學・四邊形包含關係（平行四邊形、長方形、正方形）互動故事書
  </footer>
</div>

<script>
/* ==========================================
   SVG 圖形與角色渲染器
   ========================================== */
const SHAPES = {
  rect:   { pts: [[5,42],[145,42],[145,118],[5,118]], color: '#4fa3ff' }, // 方方（長方形）
  square: { pts: [[25,25],[125,25],[125,125],[25,125]], color: '#ff7f50' }, // 小正（正方形）
  rect2:  { pts: [[40,15],[110,15],[110,130],[40,130]], color: '#6ec1ff' },
  para:   { pts: [[45,35],[150,35],[105,125],[0,125]], color: '#9b6bff' }, // 阿平爺爺
  tri:    { pts: [[75,18],[142,130],[8,130]], color: '#ffd93d' },
  quad:   { pts: [[20,45],[130,20],[118,125],[45,105]], color: '#6bd66b' }
};

function shapeSVG(key, o = {}) {
  const s = SHAPES[key] || SHAPES.rect;
  const pts = s.pts;
  const n = pts.length;
  const size = o.size || 150;
  const cx = pts.reduce((a, p) => a + p[0], 0) / n;
  const cy = pts.reduce((a, p) => a + p[1], 0) / n;
  const side = i => [pts[i], pts[(i + 1) % n]];
  let g = '';

  // 延長對邊虛線
  if (o.ext) {
    const f = o.ext === true ? 0.45 : o.ext;
    for (let i = 0; i < n; i++) {
      const [a, b] = side(i);
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const col = i % 2 ? '#1d6fd6' : '#e63946';
      g += `<line x1="${a[0] - dx * f}" y1="${a[1] - dy * f}" x2="${b[0] + dx * f}" y2="${b[1] + dy * f}" stroke="${col}" stroke-width="2.5" stroke-dasharray="6 4" opacity=".8"/>`;
    }
  }

  // 本體多邊形
  g += `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${s.color}" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>`;

  // 平行對邊粗線
  if (o.parallel) {
    for (let i = 0; i < n; i++) {
      const [a, b] = side(i);
      const col = i % 2 ? '#1d6fd6' : '#e63946';
      g += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}" stroke-width="7" stroke-linecap="round"/>`;
    }
  }

  // 直角記號
  if (o.right) {
    for (let i = 0; i < n; i++) {
      const v = pts[i], p = pts[(i - 1 + n) % n], q = pts[(i + 1) % n];
      let u1 = [p[0] - v[0], p[1] - v[1]], u2 = [q[0] - v[0], q[1] - v[1]];
      const l1 = Math.hypot(...u1), l2 = Math.hypot(...u2);
      if (l1 && l2) {
        u1 = u1.map(x => x / l1); u2 = u2.map(x => x / l2);
        if (Math.abs(u1[0] * u2[0] + u1[1] * u2[1]) < 0.05) {
          const a = 15;
          const P = [
            [v[0] + u1[0] * a, v[1] + u1[1] * a],
            [v[0] + (u1[0] + u2[0]) * a, v[1] + (u1[1] + u2[1]) * a],
            [v[0] + u2[0] * a, v[1] + u2[1] * a]
          ];
          g += `<polyline points="${P.map(p => p.join(',')).join(' ')}" fill="none" stroke="#c1121f" stroke-width="3"/><circle cx="${P[1][0]}" cy="${P[1][1]}" r="2.2" fill="#c1121f"/>`;
        }
      }
    }
  }

  // 對邊長度相等記號（長方形：上下單線，左右雙線）
  if (o.equalOpp) {
    for (let i = 0; i < n; i++) {
      const [a, b] = side(i);
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      if (L) {
        const nx = -dy / L * 8, ny = dx / L * 8;
        const tx = dx / L * 4, ty = dy / L * 4;
        const count = i % 2 === 0 ? 1 : 2;
        for (let k = 0; k < count; k++) {
          const offset = (k - (count - 1) / 2) * 2;
          const mx = a[0] + dx / 2 + tx * offset, my = a[1] + dy / 2 + ty * offset;
          g += `<line x1="${mx - nx}" y1="${my - ny}" x2="${mx + nx}" y2="${my + ny}" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>`;
        }
      }
    }
  }

  // 四邊長度相等記號（正方形）
  if (o.equalAll) {
    for (let i = 0; i < n; i++) {
      const [a, b] = side(i);
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      if (L) {
        const nx = -dy / L * 8, ny = dx / L * 8;
        const mx = a[0] + dx / 2, my = a[1] + dy / 2;
        g += `<line x1="${mx - nx}" y1="${my - ny}" x2="${mx + nx}" y2="${my + ny}" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>`;
      }
    }
  }

  if (o.rotate) {
    g = `<g transform="rotate(${o.rotate} ${cx} ${cy})">${g}</g>`;
  }

  // 面部五官
  const ey = cy - 6, ex = 14, mood = o.mood || 'happy';
  let face = `
    <circle cx="${cx - ex}" cy="${ey}" r="8" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
    <circle cx="${cx + ex}" cy="${ey}" r="8" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
    <circle cx="${cx - ex + 2}" cy="${ey + 1}" r="3.5" fill="#2b2b2b"/>
    <circle cx="${cx + ex + 2}" cy="${ey + 1}" r="3.5" fill="#2b2b2b"/>
    <circle cx="${cx - ex - 9}" cy="${cy + 9}" r="4" fill="#ff9aa2" opacity=".7"/>
    <circle cx="${cx + ex + 9}" cy="${cy + 9}" r="4" fill="#ff9aa2" opacity=".7"/>
  `;
  if (mood === 'happy') face += `<path d="M${cx - 11} ${cy + 10} Q${cx} ${cy + 24} ${cx + 11} ${cy + 10}" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>`;
  if (mood === 'sad')   face += `<path d="M${cx - 11} ${cy + 19} Q${cx} ${cy + 7} ${cx + 11} ${cy + 19}" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>`;
  if (mood === 'wow')   face += `<ellipse cx="${cx}" cy="${cy + 15}" rx="6" ry="7" fill="#2b2b2b"/>`;
  if (mood === 'think') face += `<path d="M${cx - 9} ${cy + 15} L${cx + 9} ${cy + 13}" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>`;
  if (o.glasses)        face += `<circle cx="${cx - ex}" cy="${ey}" r="11.5" fill="none" stroke="#5a3e1b" stroke-width="2.5"/><circle cx="${cx + ex}" cy="${ey}" r="11.5" fill="none" stroke="#5a3e1b" stroke-width="2.5"/><line x1="${cx - ex + 11.5}" y1="${ey}" x2="${cx + ex - 11.5}" y2="${ey}" stroke="#5a3e1b" stroke-width="2.5"/>`;
  if (o.hair)           face += `<path d="M${cx - 4} ${pts[0][1]} q4 -18 12 -10" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (o.tie)            face += `<path d="M${cx - 5} ${cy + 27} l5 5 l5 -5 l-5 -4z" fill="#c1121f"/>`;

  return `<svg viewBox="-12 -12 174 156" width="${size}" height="${size * 156 / 174}" xmlns="http://www.w3.org/2000/svg">${g}${face}</svg>`;
}

const chara = (key, o, label, cls = '') => `<figure class="chara ${cls}">${shapeSVG(key, o)}<figcaption>${label}</figcaption></figure>`;
const cardCheck = items => `<ul class="card-checklist">${items.map(i => `<li class="${i[0] ? 'y' : 'n'}">${i[0] ? '✔' : '✘'} ${i[1]}</li>`).join('')}</ul>`;
const nextBtn = (hidden = false, txt = '下一頁 ➜') => `<button type="button" class="btn next-btn ${hidden ? 'hidden' : ''}" id="nextBtn" data-next="1">${txt}</button>`;

/* ==========================================
   故事問題資料庫
   ========================================== */
const QUIZ = {
  q2: {
    q: '方方要出門尋找阿平爺爺，還想沿途檢查圖形有沒有「直角」和「對邊平行」，他應該帶什麼工具？',
    options: [
      { t: '📐 一把三角尺（可以量度直角，也可以幫忙檢查對邊是否平行）', ok: true, fb: '好主意！三角尺既可以檢查直角，又能幫忙驗證對邊是否平行。方方帶着三角尺出發囉！' },
      { t: '🧭 一個圓規', ok: false, fb: '圓規是用來畫圓形的，幫不了方方檢查直角與平行線啊！再想想。' },
      { t: '🍬 一盒朱古力', ok: false, fb: '朱古力雖然好吃，但不能用來量度幾何特徵呢！再選一次。' }
    ]
  },
  q3: {
    q: '方方發現小正（正方形）擁有長方形的所有特徵（四條邊、兩組對邊平行、四個直角）。那麼，小正也是長方形嗎？',
    options: [
      { t: '不是，正方形和長方形是兩種完全無關的圖形。', ok: false, fb: '想一想：長方形的三個基本條件，小正是不是「全部都符合」呢？' },
      { t: '是！因為正方形具備長方形的全部特徵，所以所有正方形都是長方形。', ok: true, fb: '完全正確！小正只是在長方形的基礎上多了一個特徵：四條邊長度相等。他是「特別的長方形」！' }
    ]
  },
  q4: {
    q: '歪歪有 4 條邊，他是平行四邊形家族的成員嗎？',
    options: [
      { t: '是，因為他有 4 條邊。', ok: false, fb: '有 4 條邊只是四邊形的第一個條件。請按一下「延長對邊觀察」看看他的對邊會怎樣！' },
      { t: '不是，因為他的對邊延長後會相交，沒有兩組對邊平行。', ok: true, fb: '答對了！歪歪雖然是四邊形，但沒有兩組對邊分別平行，所以不是平行四邊形家族的成員。' }
    ]

function quizHTML(id, reveal = '') {
  const BADGES = ['A', 'B', 'C', 'D'];
  const q = QUIZ[id];
  return `
    <div class="quiz-card" data-q="${id}" data-reveal="${reveal}">
      <h3>🤔 ${q.q}</h3>
      <div class="choices-container">
        ${q.options.map((o, i) => `
          <button type="button" class="choice-btn" data-opt="${i}">
            <span class="badge-box badge-${BADGES[i]}">${BADGES[i]}</span>
            <span class="choice-text">${o.t}</span>
          </button>
        `).join('')}
      </div>
      <div class="fb"></div>
    </div>
  `;
}

      <div class="scene home"><div class="stage">${chara('para',{glasses:true,parallel:true,size:130},'兩組對邊平行')}${chara('rect',{tie:true,parallel:true,right:true,size:130},'＋四個直角')}${chara('square',{hair:true,parallel:true,right:true,equalAll:true,size:130},'＋四條邊長度相等')}</div></div>
      ${nextBtn(false, '接受分類挑戰 ➜')}
    `
  },
  { // 9 分類挑戰
    narr: '鄰居分類挑戰！聚會開始了，來了六位鄰居。請你幫方方判斷，每一位屬於哪一類？',
    render: () => `
      <h2 class="pagetitle">第九章：鄰居分類挑戰 🏅</h2>
      <p class="narr">聚會開始了，來了 6 位鄰居！請你幫方方判斷，每一位屬於哪一類？</p>
      <div class="scene home py-4" id="sortBox"></div>
      ${nextBtn(true, '看雙書大結局 ➜')}
    `,
    after: () => {
      state.sortIdx = 0;
      state.sortScore = 0;
      renderSortItem();
    }
  },
  { // 10 大結局
    narr: '大結局！方方明白了：他是長方形，也是平行四邊形；小正是正方形，也是長方形，也是平行四邊形。他們一家三代都是平行四邊形家族的成員！',
    render: () => `
      <h2 class="pagetitle" style="justify-content:center; font-size:1.8rem">🎊 大結局：四邊形家族大合照</h2>
      <div class="scene home"><div class="stage">${chara('para',{glasses:true,size:190},'阿平爺爺・平行四邊形')}${chara('rect',{tie:true,size:175},'方方・長方形')}${chara('square',{hair:true,size:150},'小正・正方形')}</div></div>
      <div class="bubble">方方：「我終於全明白了！我是<b>長方形</b>，也是<b>平行四邊形</b>；而小正不但是<b>正方形</b>，還是<b>長方形</b>和<b>平行四邊形</b>！」</div>
      <div class="rule">🧬 <b>包含關係記憶口訣</b><br>對邊平行 → 平行四邊形<br>加上四直角 → 長方形<br>再加上四條邊長度相等 → 正方形</div>
      <p class="narr" style="text-align:center">你在分類挑戰中答對了 <span class="score">${state.sortScore} / ${SORT_ITEMS.length}</span> 題！</p>
      <div class="p-3 bg-blue-50 rounded-xl text-xs text-blue-900 border border-blue-200 mt-3 space-y-1">
        <div>👩‍🏫 <b>教師小貼士</b>：本故事配合香港小三數學「四邊形」課題，從長方形視角建立「正方形是特別的長方形，而長方形也是平行四邊形」的包含概念。</div>
        <div>💡 <b>雙書聯動彩蛋</b>：恭喜完成《長方形尋親記》！可與《正方形尋親記》對照閱讀，體驗完整的雙主角四邊形宇宙。</div>
      </div>
      <button type="button" class="btn next-btn" data-goto="0">🔄 再讀一次</button>
    `,
    after: () => confetti()
  }
];

/* ==========================================
   核心頁面導航與 UI 渲染
   ========================================== */
function goToPage(n) {
  state.page = Math.max(0, Math.min(pages.length - 1, n));
  const p = pages[state.page];
  const pageEl = document.getElementById('page');
  if (!pageEl) return;

  pageEl.innerHTML = typeof p.render === 'function' ? p.render() : p.render;
  pageEl.style.animation = 'none';
  pageEl.offsetHeight; // 強制重繪觸發 CSS 動畫
  pageEl.style.animation = '';

  if (p.after) p.after();

  const prog = document.getElementById('prog');
  if (prog) {
    const pageTitles = [
      '封面', '第1章：認識方方', '第2章：爺爺的邀請信', '第3章：山腳遇見小正',
      '第4章：路上的新朋友', '第5章：分岔路的抉擇', '第6章：沿途的發現',
      '第7章：找到阿平爺爺', '第8章：家族大族譜', '第9章：鄰居分類挑戰', '第10章：大結局'
    ];
    prog.innerHTML = pages.map((_, i) =>
      `<button type="button" class="prog-dot ${i < state.page ? 'done' : i === state.page ? 'cur' : ''}" data-goto="${i}" title="${pageTitles[i] || '第 ' + i + ' 頁'}" aria-label="${pageTitles[i] || '第 ' + i + ' 頁'}">${i === 0 ? '🏠' : i}</button>`
    ).join('');
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const readBtn = document.getElementById('readBtn');
  if (readBtn) readBtn.textContent = '🔊 朗讀';
}

function renderHeroFeature() {
  const f = state.seen;
  const heroEl = document.getElementById('heroShape');
  if (heroEl) {
    heroEl.innerHTML = chara('rect', {
      tie: true,
      size: 210,
      parallel: f.has('parallel'),
      right: f.has('right'),
      equalOpp: f.has('equalOpp')
    }, '方方（長方形）');
  }
}

function renderSortItem() {
  const box = document.getElementById('sortBox');
  if (!box) return;

  if (state.sortIdx >= SORT_ITEMS.length) {
    box.innerHTML = `
      <div class="text-center p-4">
        <p class="narr">🎉 分類挑戰完成！你答對了 <span class="score">${state.sortScore} / ${SORT_ITEMS.length}</span> 題。</p>
        <div class="stage flex justify-center mt-4">${chara('rect', { tie: true, mood: 'happy' }, '方方：「你真厲害！」')}</div>
      </div>
    `;
    const nextBtnEl = document.getElementById('nextBtn');
    if (nextBtnEl) nextBtnEl.classList.remove('hidden');
    return;
  }

  const it = SORT_ITEMS[state.sortIdx];
  state.sortLocked = false;

  box.innerHTML = `
    <div class="sort-container text-center">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
        <span class="font-bold text-blue-900">第 ${state.sortIdx + 1} / ${SORT_ITEMS.length} 位鄰居 — 他是……？</span>
        <button type="button" class="btn" data-action="hint" style="padding:4px 12px; font-size:0.9rem; min-height:36px;">🔍 顯示特徵記號</button>
      </div>
      <div class="stage flex justify-center py-4" id="sortStage">${chara(it.key, { ...it.o, size: 160 }, '？')}</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
        ${SORT_LABELS.map((l, i) => `
          <button type="button" class="choice-btn" data-sort-opt="${i}">
            <span class="badge-box badge-${['A','B','C','D'][i]}">${['A','B','C','D'][i]}</span>
            <span class="choice-text text-left">${l}</span>
          </button>
        `).join('')}
      </div>
      <div class="fb"></div>
    </div>
  `;
}

function playSound(ok = true) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(ok ? 660 : 300, ctx.currentTime);
    if (ok) osc.frequency.setValueAtTime(990, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) {}
}

function confetti() {
  const cols = ['#4fa3ff', '#ff7f50', '#9b6bff', '#ffd93d', '#6bd66b', '#38bdf8'];
  for (let i = 0; i < 70; i++) {
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = cols[i % cols.length];
    d.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    d.style.animationDelay = (Math.random() * 1.5) + 's';
    d.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 6000);
  }
}

/* ==========================================
   事件監聽與初始化
   ========================================== */
function initApp() {
  document.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;

    if (t.id === 'homeBtn') { goToPage(0); return; }
    if (t.dataset.next) { goToPage(state.page + 1); return; }
    if (t.dataset.goto !== undefined) { goToPage(+t.dataset.goto); return; }
    if (t.dataset.path) { state.path = t.dataset.path; playSound(true); goToPage(state.page + 1); return; }
    if (t.dataset.switchPath) { state.path = t.dataset.switchPath; playSound(true); goToPage(state.page); return; }

    // 第一章：特徵探究按鈕
    if (t.dataset.feature) {
      const f = t.dataset.feature;
      state.seen.add(f);
      t.classList.add('on');
      renderHeroFeature();
      const featText = document.getElementById('featText');
      if (featText) featText.innerHTML = FEAT_DESC[f];
      if (state.seen.size === 3) {
        const nextBtnEl = document.getElementById('nextBtn');
        if (nextBtnEl) nextBtnEl.classList.remove('hidden');
        const featHint = document.getElementById('featHint');
        if (featHint) featHint.textContent = '三個特徵都觀察過囉，做得好！👍';
        playSound(true);
      }
      return;
    }

    // 第四章：延長對邊觀察
    if (t.dataset.toggleExt) {
      state.ext = !state.ext;
      t.classList.toggle('on', state.ext);
      const quadStage = document.getElementById('quadStage');
      if (quadStage) {
        quadStage.innerHTML =
          chara('rect', { tie: true, size: 150 }, '方方') +
          chara('tri', { mood: 'happy', size: 130 }, '阿三（3條邊）') +
          chara('quad', { mood: state.ext ? 'sad' : 'happy', ext: state.ext ? 0.8 : false, size: 160 }, '歪歪（4條邊）');
      }
      const extText = document.getElementById('extText');
      if (extText) extText.classList.toggle('hidden', !state.ext);
      return;
    }

    // 第九章：分類挑戰提示特徵
    if (t.dataset.action === 'hint') {
      const it = SORT_ITEMS[state.sortIdx];
      const sortStage = document.getElementById('sortStage');
      if (sortStage && it) {
        const hasParallel = ['para', 'rect', 'rect2', 'square'].includes(it.key);
        const hasRight = ['rect', 'rect2', 'square'].includes(it.key);
        sortStage.innerHTML = chara(it.key, {
          ...it.o,
          size: 160,
          parallel: hasParallel,
          right: hasRight,
          equalAll: it.key === 'square',
          equalOpp: it.key === 'rect' || it.key === 'rect2',
          ext: it.key === 'quad' ? 0.8 : false
        }, '？');
      }
      return;
    }

    // 第九章：分類挑戰選項
    if (t.dataset.sortOpt !== undefined) {
      if (state.sortLocked) return;
      const it = SORT_ITEMS[state.sortIdx];
      const i = +t.dataset.sortOpt;
      const container = t.closest('.sort-container');
      const fb = container ? container.querySelector('.fb') : null;
      if (!it || !fb) return;

      if (i === it.ans) {
        state.sortLocked = true;
        state.sortScore++;
        t.classList.add('sel-correct');
        fb.className = 'fb show ok';
        fb.innerHTML = '✅ ' + it.fb + ' <button type="button" class="btn" data-sortnext="1" style="margin-left:8px; padding:4px 12px; font-size:0.9rem; min-height:36px;">下一位 ➜</button>';
        playSound(true);
      } else {
        t.classList.add('sel-wrong');
        t.disabled = true;
        fb.className = 'fb show no';
        fb.innerHTML = '💡 再想一想：先數邊數，再看兩組對邊是否平行，然後看是否有四個直角與四邊相等。';
        playSound(false);
      }
      return;
    }

    if (t.dataset.sortnext) {
      state.sortIdx++;
      renderSortItem();
      return;
    }

    // 選擇題解答驗證
    if (t.dataset.opt !== undefined) {
      const qCard = t.closest('.quiz-card');
      if (!qCard || qCard.classList.contains('done')) return;
      const q = QUIZ[qCard.dataset.q];
      const opt = q ? q.options[+t.dataset.opt] : null;
      const fb = qCard.querySelector('.fb');
      if (!q || !opt || !fb) return;

      fb.innerHTML = (opt.ok ? '✅ ' : '💡 ') + opt.fb;
      fb.className = 'fb show ' + (opt.ok ? 'ok' : 'no');

      if (opt.ok) {
        qCard.classList.add('done');
        t.classList.add('sel-correct');
        qCard.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
        playSound(true);
        if (qCard.dataset.reveal) {
          qCard.dataset.reveal.split(',').forEach(sel => {
            document.querySelectorAll(sel.trim()).forEach(el => el.classList.remove('hidden'));
          });
        }
      } else {
        t.classList.add('sel-wrong');
        t.disabled = true;
        playSound(false);
      }
    }
  });

  // 廣東話語音朗讀（支援播放／停止切換）
  const readBtn = document.getElementById('readBtn');
  if (readBtn) {
    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }
    readBtn.onclick = () => {
      if (!('speechSynthesis' in window)) return;
      if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        readBtn.textContent = '🔊 朗讀';
        return;
      }
      speechSynthesis.cancel();
      const p = pages[state.page];
      const txt = typeof p.narr === 'function' ? p.narr() : p.narr;
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'zh-HK';
      u.rate = 0.9;
      const voices = speechSynthesis.getVoices();
      const v = voices.find(v => v.lang.replace('_', '-') === 'zh-HK') || voices.find(v => v.lang.startsWith('zh'));
      if (v) u.voice = v;
      u.onstart = () => { readBtn.textContent = '⏹️ 停止'; };
      u.onend = () => { readBtn.textContent = '🔊 朗讀'; };
      u.onerror = () => { readBtn.textContent = '🔊 朗讀'; };
      speechSynthesis.speak(u);
    };
  }

  // 初始化前往封面頁
  goToPage(0);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
</body>
</html>
