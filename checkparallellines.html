    <script>
        /**
         * Web Audio API Synthesizer Sound Engine
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
            }

            playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { console.error(e); }
            }

            playWhoosh() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.35);
                } catch(e) {}
            }

            playClick() {
                this.playTone(600, 'sine', 0.05, 0.08);
            }

            playSuccess() {
                if (this.muted) return;
                this.init();
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'triangle', 0.18, 0.12);
                    }, idx * 80);
                });
            }

            playError() {
                if (this.muted) return;
                this.init();
                this.playTone(220, 'sawtooth', 0.2, 0.12);
                setTimeout(() => this.playTone(175, 'sawtooth', 0.25, 0.12), 110);
            }

            playStageWin() {
                if (this.muted) return;
                this.init();
                const notes = [392, 523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'square', 0.25, 0.1);
                    }, idx * 100);
                });
            }

            playGrandWin() {
                if (this.muted) return;
                this.init();
                const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'triangle', 0.35, 0.15);
                    }, idx * 110);
                });
            }
        }

        /**
         * GAME ENGINE & SYSTEM CONTROLLER
         */
        class Game {
            constructor() {
                this.currentLevelIdx = 0;
                this.score = 0;
                this.extendFactor = 0; // 0.0 to 1.0
                this.showGrid = true;
                this.selectedPairs = new Set();
                this.selectedBoolean = null;
                this.isSubmitted = false;

                // DOM Elements
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.extendSlider = document.getElementById('extend-slider');
                this.extendSliderContainer = document.getElementById('extend-slider-container');
                this.phase2LockNotice = document.getElementById('phase2-lock-notice');
                this.extendValLabel = document.getElementById('extend-val');
                this.gridToggleBtn = document.getElementById('grid-toggle-btn');
                this.gridBtnText = document.getElementById('grid-btn-text');
                this.resetExtBtn = document.getElementById('reset-ext-btn');
                this.actionBtn = document.getElementById('action-btn');
                this.levelDisplay = document.getElementById('level-display');
                this.scoreDisplay = document.getElementById('score-display');
                this.stageProgressBar = document.getElementById('stage-progress-bar');
                
                this.questionTitle = document.getElementById('question-title');
                this.questionDesc = document.getElementById('question-desc');
                this.questionPhaseTag = document.getElementById('question-phase-tag');
                this.answerOptionsContainer = document.getElementById('answer-options');
                this.knowledgeTitle = document.getElementById('knowledge-title');
                this.knowledgeText = document.getElementById('knowledge-text');
                this.canvasStatus = document.getElementById('canvas-status');
                this.phaseBadge = document.getElementById('phase-badge');

                // Modal Elements
                this.modal = document.getElementById('modal');
                this.modalIconBg = document.getElementById('modal-icon-bg');
                this.modalIcon = document.getElementById('modal-icon');
                this.modalTitle = document.getElementById('modal-title');
                this.modalDesc = document.getElementById('modal-desc');
                this.modalScore = document.getElementById('modal-score');
                this.modalActionBtn = document.getElementById('modal-action-btn');
                this.modalSecondaryBtn = document.getElementById('modal-secondary-btn');
                this.modalBtnText = document.getElementById('modal-btn-text');
                this.modalBtnIcon = document.getElementById('modal-btn-icon');

                this.init();
            }

            init() {
                this.bindEvents();
                this.resizeCanvas();
                this.loadLevel(0);
                requestAnimationFrame(() => this.render());
            }

            bindEvents() {
                window.addEventListener('resize', () => this.resizeCanvas());

                // Slider Input
                this.extendSlider.addEventListener('input', (e) => {
                    this.extendFactor = parseFloat(e.target.value) / 100;
                    this.extendValLabel.textContent = `${e.target.value}%`;
                    audio.playClick();
                });

                // Grid Toggle
                this.gridToggleBtn.addEventListener('click', () => {
                    this.showGrid = !this.showGrid;
                    this.gridBtnText.textContent = this.showGrid ? '隱藏網格' : '顯示網格';
                    audio.playClick();
                });

                // Reset Slider
                this.resetExtBtn.addEventListener('click', () => {
                    if (LEVELS[this.currentLevelIdx].phase === 2 && !this.isSubmitted) return;
                    this.extendSlider.value = 0;
                    this.extendFactor = 0;
                    this.extendValLabel.textContent = '0%';
                    audio.playClick();
                });

                // Sound Toggle
                document.getElementById('sound-btn').addEventListener('click', () => {
                    audio.muted = !audio.muted;
                    const icon = document.getElementById('sound-icon');
                    icon.className = audio.muted ? 'fa-solid fa-volume-xmark text-rose-300' : 'fa-solid fa-volume-high text-white';
                });

                // Action Button
                this.actionBtn.addEventListener('click', () => this.handleAction());

                // Modal Primary Button
                this.modalActionBtn.addEventListener('click', () => {
                    audio.playClick();
                    this.modal.classList.add('hidden');
                    
                    if (this.pendingNextStage) {
                        this.pendingNextStage = false;
                        this.loadLevel(this.currentLevelIdx + 1);
                    } else if (this.isErrorModal) {
                        // User acknowledged error explanation, remain on level to retry
                        this.isErrorModal = false;
                    } else if (this.currentLevelIdx < LEVELS.length - 1) {
                        this.loadLevel(this.currentLevelIdx + 1);
                    } else {
                        // Restart game
                        this.currentLevelIdx = 0;
                        this.score = 0;
                        this.scoreDisplay.textContent = '0';
                        this.loadLevel(0);
                    }
                });

                // Modal Secondary "🔍 延長線段測試" Button (Triggers proof animation)
                this.modalSecondaryBtn.addEventListener('click', () => {
                    audio.playClick();
                    this.modal.classList.add('hidden');
                    this.isErrorModal = false;
                    audio.playWhoosh();
                    this.animateSliderTo(100);
                });
            }

            resizeCanvas() {
                const container = document.getElementById('canvas-container');
                const rect = container.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                
                this.canvas.width = rect.width * dpr;
                this.canvas.height = rect.height * dpr;
                this.ctx.scale(dpr, dpr);
                this.viewportWidth = rect.width;
                this.viewportHeight = rect.height;
            }

            loadLevel(idx) {
                this.currentLevelIdx = idx;
                this.isSubmitted = false;
                this.pendingNextStage = false;
                this.isErrorModal = false;

                this.extendSlider.value = 0;
                this.extendFactor = 0;
                this.extendValLabel.textContent = '0%';
                this.selectedPairs.clear();
                this.selectedBoolean = null;

                const lvl = LEVELS[this.currentLevelIdx];

                // Phase 2 Controls Adjustments (Hide Slider pre-prediction in Phase 2)
                if (lvl.phase === 2) {
                    this.extendSliderContainer.classList.add('hidden');
                    this.phase2LockNotice.classList.remove('hidden');
                    this.phase2LockNotice.classList.add('flex');
                } else {
                    this.extendSliderContainer.classList.remove('hidden');
                    this.phase2LockNotice.classList.add('hidden');
                    this.phase2LockNotice.classList.remove('flex');
                }

                // Progress & Header Updates
                this.levelDisplay.textContent = `${lvl.level} / ${LEVELS.length}`;
                const pct = Math.round((lvl.level / LEVELS.length) * 100);
                this.stageProgressBar.style.width = `${pct}%`;

                this.phaseBadge.textContent = lvl.phaseTitle;
                this.questionPhaseTag.textContent = `第 ${lvl.level} 關 • ${lvl.title}`;
                this.questionTitle.textContent = lvl.title;
                this.questionDesc.textContent = lvl.desc;
                this.canvasStatus.textContent = `${lvl.phaseTitle} (線段數: ${lvl.segments.length})`;

                // Action Button Reset
                if (lvl.phase === 2) {
                    this.actionBtn.innerHTML = `<span>提交預測與驗證</span> <i class="fa-solid fa-play"></i>`;
                } else {
                    this.actionBtn.innerHTML = `<span>提交答案</span> <i class="fa-solid fa-paper-plane"></i>`;
                }
                this.actionBtn.className = "w-full py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base shadow-lg shadow-indigo-200 transition duration-200 active:scale-[0.98] flex items-center justify-center space-x-2";

                // Default Knowledge Card
                this.knowledgeTitle.textContent = "什麼是平行線？";
                this.knowledgeText.textContent = "在「同一平面」上，不管怎麼向兩端無限延長，都「永遠不會相交」的兩條直線，我們就稱這兩條直線互相平行！";

                this.renderAnswerOptions(lvl);
            }

            renderAnswerOptions(lvl) {
                this.answerOptionsContainer.innerHTML = '';

                if (lvl.type === 'boolean') {
                    // Phase 1 or 2 T/F options with strict wording
                    const btn1 = document.createElement('button');
                    btn1.className = `option-btn w-full p-3.5 rounded-xl border-2 text-left font-bold flex items-center justify-between transition border-slate-200 hover:border-indigo-400 bg-slate-50`;
                    btn1.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center font-black">1</div>
                            <div>
                                <div class="text-slate-800 font-bold text-sm">1. 相交，不是一組平行線</div>
                                <div class="text-[11px] text-slate-500 font-normal">無限延伸後會交叉並產生相交點</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-circle-check text-indigo-600 text-xl opacity-0 check-icon"></i>
                    `;
                    btn1.onclick = () => this.selectBooleanOption(true, btn1, btn2);

                    const btn2 = document.createElement('button');
                    btn2.className = `option-btn w-full p-3.5 rounded-xl border-2 text-left font-bold flex items-center justify-between transition border-slate-200 hover:border-indigo-400 bg-slate-50`;
                    btn2.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-black">2</div>
                            <div>
                                <div class="text-slate-800 font-bold text-sm">2. 不相交，是一組平行線</div>
                                <div class="text-[11px] text-slate-500 font-normal">無限延伸永遠保持距離，永不相交</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-circle-check text-indigo-600 text-xl opacity-0 check-icon"></i>
                    `;
                    btn2.onclick = () => this.selectBooleanOption(false, btn2, btn1);

                    this.answerOptionsContainer.appendChild(btn1);
                    this.answerOptionsContainer.appendChild(btn2);

                } else if (lvl.type === 'multiselect') {
                    // Phase 3 Multi-select options
                    const segs = lvl.segments;
                    const pairs = [];
                    for (let i = 0; i < segs.length; i++) {
                        for (let j = i + 1; j < segs.length; j++) {
                            pairs.push(`${segs[i].id}-${segs[j].id}`);
                        }
                    }

                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'grid grid-cols-2 gap-2 max-h-[220px] overflow-y-auto pr-1';

                    pairs.forEach(pair => {
                        const [idA, idB] = pair.split('-');
                        const segA = segs.find(s => s.id === idA);
                        const segB = segs.find(s => s.id === idB);

                        const chip = document.createElement('button');
                        chip.className = `pair-chip p-2.5 rounded-xl border-2 font-bold text-xs flex items-center justify-between transition border-slate-200 bg-slate-50 hover:bg-indigo-50/50`;
                        chip.innerHTML = `
                            <div class="flex items-center space-x-1.5">
                                <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color:${segA.color}"></span>
                                <span>線段 ${idA}</span>
                                <span class="text-slate-400 font-light">&</span>
                                <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color:${segB.color}"></span>
                                <span>線段 ${idB}</span>
                            </div>
                            <div class="w-4 h-4 rounded border border-slate-300 flex items-center justify-center check-box bg-white">
                                <i class="fa-solid fa-check text-[10px] text-indigo-600 hidden"></i>
                            </div>
                        `;
                        chip.onclick = () => this.togglePairSelection(pair, chip);
                        gridDiv.appendChild(chip);
                    });

                    this.answerOptionsContainer.appendChild(gridDiv);
                }
            }

            selectBooleanOption(val, selectedBtn, otherBtn) {
                if (this.isSubmitted) return;
                audio.playClick();
                this.selectedBoolean = val;

                selectedBtn.classList.add('border-indigo-600', 'bg-indigo-50/60');
                selectedBtn.querySelector('.check-icon').classList.remove('opacity-0');

                otherBtn.classList.remove('border-indigo-600', 'bg-indigo-50/60');
                otherBtn.querySelector('.check-icon').classList.add('opacity-0');
            }

            togglePairSelection(pair, chipBtn) {
                if (this.isSubmitted) return;
                audio.playClick();

                const checkBox = chipBtn.querySelector('.check-box');
                const checkIcon = checkBox.querySelector('i');

                if (this.selectedPairs.has(pair)) {
                    this.selectedPairs.delete(pair);
                    chipBtn.classList.remove('border-indigo-600', 'bg-indigo-50');
                    checkBox.classList.remove('bg-indigo-600', 'border-indigo-600');
                    checkIcon.classList.add('hidden');
                } else {
                    this.selectedPairs.add(pair);
                    chipBtn.classList.add('border-indigo-600', 'bg-indigo-50');
                    checkBox.classList.add('bg-indigo-600', 'border-indigo-600');
                    checkIcon.classList.remove('hidden');
                }
            }

            handleAction() {
                audio.playClick();

                if (this.isSubmitted) {
                    this.nextLevelOrStagePopup();
                    return;
                }

                const lvl = LEVELS[this.currentLevelIdx];
                let isCorrect = false;

                if (lvl.type === 'boolean') {
                    if (this.selectedBoolean === null) {
                        this.showTempNotice(lvl.phase === 2 ? '【請先選擇預測】點擊選擇選項 1 或 2！' : '請先選擇一個選項！');
                        return;
                    }
                    isCorrect = (this.selectedBoolean === lvl.correctAnswer);
                } else if (lvl.type === 'multiselect') {
                    if (this.selectedPairs.size === 0) {
                        this.showTempNotice('請先勾選你延長測試後發現互相平行的線段組合！');
                        return;
                    }
                    const userArr = Array.from(this.selectedPairs).sort();
                    const correctArr = [...lvl.correctPairs].sort();
                    isCorrect = (userArr.length === correctArr.length) && userArr.every((v, i) => v === correctArr[i]);
                }

                if (isCorrect) {
                    this.isSubmitted = true;
                    this.score += 100;
                    this.scoreDisplay.textContent = this.score;

                    audio.playWhoosh();
                    this.animateSliderTo(100, () => {
                        audio.playSuccess();
                        this.knowledgeTitle.textContent = "🎉 答對了！你真棒！";
                        this.knowledgeText.textContent = lvl.explanation;

                        this.actionBtn.innerHTML = `<span>回答正確！點擊繼續</span> <i class="fa-solid fa-arrow-right"></i>`;
                        this.actionBtn.className = "w-full py-3.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base shadow-lg shadow-emerald-200 transition duration-200 active:scale-[0.98] flex items-center justify-center space-x-2";
                    });
                } else {
                    audio.playError();
                    this.isErrorModal = true;
                    const proofHtml = `<b>很好的嘗試！</b>延長線段之後，可以更清楚地看到線段到底有沒有碰到喔！<br><br>${lvl.explanation}`;
                    this.showErrorProofModal("❌ 答錯了，不如再試一試吧！", proofHtml);
                }
            }

            showTempNotice(text) {
                const notice = document.createElement('div');
                notice.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 bg-rose-600 text-white px-6 py-3 rounded-2xl shadow-2xl z-50 font-bold text-sm flex items-center space-x-2 animate-bounce';
                notice.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>${text}</span>`;
                document.body.appendChild(notice);
                setTimeout(() => notice.remove(), 2200);
            }

            showErrorProofModal(title, proofHtml) {
                this.modalTitle.textContent = title;
                this.modalDesc.innerHTML = proofHtml;
                this.modalScore.textContent = `${this.score} 分`;
                
                this.modalIcon.className = "fa-solid fa-xmark";
                this.modalIconBg.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner border-4 bg-rose-100 text-rose-500 border-rose-200";

                this.modalSecondaryBtn.classList.remove('hidden');
                this.modalSecondaryBtn.classList.add('flex');

                this.modalBtnText.textContent = "我知道了，重新思考";
                this.modalBtnIcon.className = "fa-solid fa-rotate-left";

                this.modal.classList.remove('hidden');
            }

            nextLevelOrStagePopup() {
                if (this.currentLevelIdx === 3) {
                    // End of Phase 1 (Level 4)
                    this.pendingNextStage = true;
                    this.showStageModal(
                        "🎉 恭喜完成第一階段！",
                        "你已經深刻觀察並理解了平行線的核心觀念：<b>在同一平面上，無論怎麼向兩端無限延長，都永不相交的兩條直線就是平行線！</b><br><br>準備好挑戰第二階段的幾何直覺預測了嗎？",
                        "進入第二階段：預測與驗證",
                        "fa-circle-check",
                        "bg-emerald-100 text-emerald-600 border-emerald-200"
                    );
                } else if (this.currentLevelIdx === 7) {
                    // End of Phase 2 (Level 8)
                    this.pendingNextStage = true;
                    this.showStageModal(
                        "🎉 恭喜完成第二階段！",
                        "太厲害了！你成功通過了完全無預先延長的預測考驗！證明你已經建立起紮實的平行線幾何直覺！<br><br>接下來將進入包含 <b>3~4 條線段與視錯覺</b> 的終極大挑戰！",
                        "進入第三階段：多線段錯覺挑戰",
                        "fa-eye",
                        "bg-indigo-100 text-indigo-600 border-indigo-200"
                    );
                } else if (this.currentLevelIdx === LEVELS.length - 1) {
                    // End of Phase 3 (Level 11) -> Grand Victory
                    audio.playGrandWin();
                    this.showStageModal(
                        "🏆 全通關總結榮譽視窗",
                        `太了不起了！你成功識破了所有視錯覺干擾，精準找出所有平行線段組！<br><br><b>總結得分：${this.score} 分</b><br>獲頒：<b>幾何平行線特級大師榮譽勳章</b> 🥇`,
                        "重新挑戰大冒險",
                        "fa-trophy",
                        "bg-amber-100 text-amber-500 border-amber-200"
                    );
                } else {
                    this.loadLevel(this.currentLevelIdx + 1);
                }
            }

            showStageModal(title, descHtml, btnText, iconClass, styleClasses) {
                audio.playStageWin();
                this.modalTitle.textContent = title;
                this.modalDesc.innerHTML = descHtml;
                this.modalBtnText.textContent = btnText;
                this.modalBtnIcon.className = "fa-solid fa-arrow-right";
                this.modalScore.textContent = `${this.score} 分`;
                
                this.modalIcon.className = `fa-solid ${iconClass}`;
                this.modalIconBg.className = `w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner border-4 ${styleClasses}`;

                this.modalSecondaryBtn.classList.add('hidden');
                this.modalSecondaryBtn.classList.remove('flex');

                this.modal.classList.remove('hidden');
            }

            animateSliderTo(targetVal, onComplete) {
                let current = parseInt(this.extendSlider.value);
                const step = () => {
                    if (current < targetVal) {
                        current += 5;
                        if (current > targetVal) current = targetVal;
                        this.extendSlider.value = current;
                        this.extendFactor = current / 100;
                        this.extendValLabel.textContent = `${current}%`;
                        requestAnimationFrame(step);
                    } else {
                        if (onComplete) onComplete();
                    }
                };
                requestAnimationFrame(step);
            }

            /**
             * GEOMETRY CALCULATION ENGINE
             */
            findIntersection(segA, segB, factor) {
                const scaleX = this.viewportWidth / 800;
                const scaleY = this.viewportHeight / 500;

                const ax1 = segA.x1 * scaleX, ay1 = segA.y1 * scaleY;
                const ax2 = segA.x2 * scaleX, ay2 = segA.y2 * scaleY;
                const bx1 = segB.x1 * scaleX, by1 = segB.y1 * scaleY;
                const bx2 = segB.x2 * scaleX, by2 = segB.y2 * scaleY;

                // Extension multiplier for rendering bounding calculation
                const extLen = factor * 7.0;

                const vAx = ax2 - ax1, vAy = ay2 - ay1;
                const vBx = bx2 - bx1, vBy = by2 - by1;

                const P1x = ax1 - extLen * vAx, P1y = ay1 - extLen * vAy;
                const P2x = ax2 + extLen * vAx, P2y = ay2 + extLen * vAy;

                const P3x = bx1 - extLen * vBx, P3y = by1 - extLen * vBy;
                const P4x = bx2 + extLen * vBx, P4y = by2 + extLen * vBy;

                const denom = (P4y - P3y) * (P2x - P1x) - (P4x - P3x) * (P2y - P1y);
                if (Math.abs(denom) < 1e-5) return null; // Parallel

                const ua = ((P4x - P3x) * (P1y - P3y) - (P4y - P3y) * (P1x - P3x)) / denom;
                const ub = ((P2x - P1x) * (P1y - P3y) - (P2y - P1y) * (P1x - P3x)) / denom;

                if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
                    const ix = P1x + ua * (P2x - P1x);
                    const iy = P1y + ua * (P2y - P1y);
                    // Map back to 800x500 coordinates for badge display
                    return { x: ix, y: iy, origX: Math.round(ix / scaleX), origY: Math.round(iy / scaleY) };
                }

                return null;
            }

            /**
             * CANVAS RENDER LOOP
             */
            render() {
                const ctx = this.ctx;
                const w = this.viewportWidth;
                const h = this.viewportHeight;

                // Canvas Background
                ctx.fillStyle = '#0f172a'; // Slate 900
                ctx.fillRect(0, 0, w, h);

                // Auxiliary Grid
                if (this.showGrid) {
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 1;
                    const gridSize = 40 * (w / 800);
                    
                    ctx.beginPath();
                    for (let x = 0; x < w; x += gridSize) {
                        ctx.moveTo(x, 0); ctx.lineTo(x, h);
                    }
                    for (let y = 0; y < h; y += gridSize) {
                        ctx.moveTo(0, y); ctx.lineTo(w, y);
                    }
                    ctx.stroke();
                }

                const lvl = LEVELS[this.currentLevelIdx];
                const scaleX = w / 800;
                const scaleY = h / 500;
                const extMul = this.extendFactor * 6.0;

                // Render Segments
                lvl.segments.forEach(seg => {
                    const x1 = seg.x1 * scaleX, y1 = seg.y1 * scaleY;
                    const x2 = seg.x2 * scaleX, y2 = seg.y2 * scaleY;

                    const dx = x2 - x1;
                    const dy = y2 - y1;

                    const extX1 = x1 - dx * extMul;
                    const extY1 = y1 - dy * extMul;
                    const extX2 = x2 + dx * extMul;
                    const extY2 = y2 + dy * extMul;

                    // 1. Dashed Extension Tracks
                    if (this.extendFactor > 0) {
                        ctx.save();
                        ctx.strokeStyle = seg.color;
                        ctx.globalAlpha = 0.55;
                        ctx.lineWidth = 3;
                        ctx.setLineDash([8, 6]);
                        ctx.beginPath();
                        ctx.moveTo(extX1, extY1);
                        ctx.lineTo(extX2, extY2);
                        ctx.stroke();
                        ctx.restore();
                    }

                    // 2. Solid Segment Line
                    ctx.save();
                    ctx.strokeStyle = seg.color;
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.shadowColor = seg.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    ctx.restore();

                    // 3. Segment ID Label Badges
                    this.drawLabel(seg.id, x1 - 18, y1 - 18, seg.color);
                });

                // Calculate & Render Intersection Points
                const segs = lvl.segments;
                let foundAnyIntersection = false;

                for (let i = 0; i < segs.length; i++) {
                    for (let j = i + 1; j < segs.length; j++) {
                        const pt = this.findIntersection(segs[i], segs[j], this.extendFactor);
                        if (pt) {
                            foundAnyIntersection = true;
                            this.drawIntersectionPoint(pt.x, pt.y, pt.origX, pt.origY);
                        }
                    }
                }

                // If Extended (>50%) & No Intersections, Draw Parallel Symbol Badge
                if (this.extendFactor > 0.5 && !foundAnyIntersection) {
                    this.drawParallelBadge();
                }

                requestAnimationFrame(() => this.render());
            }

            drawLabel(text, x, y, color) {
                const ctx = this.ctx;
                ctx.save();
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, 13, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px "Fredoka One", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x, y);
                ctx.restore();
            }

            drawIntersectionPoint(x, y, origX, origY) {
                const ctx = this.ctx;
                const time = Date.now() * 0.005;
                const pulseRadius = 12 + Math.sin(time) * 4;

                ctx.save();
                // Outer Pulsating Ring
                ctx.fillStyle = 'rgba(244, 63, 94, 0.4)';
                ctx.beginPath();
                ctx.arc(x, y, pulseRadius + 6, 0, Math.PI * 2);
                ctx.fill();

                // Solid Red Intersect Point
                ctx.fillStyle = '#f43f5e';
                ctx.shadowColor = '#f43f5e';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Coordinate Tag Badge
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px "Noto Sans TC", sans-serif';
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#000000';
                ctx.fillText(`相交點 (${origX}, ${origY})`, x + 14, y - 10);
                ctx.restore();
            }

            drawParallelBadge() {
                const ctx = this.ctx;
                const w = this.viewportWidth;
                const h = this.viewportHeight;

                ctx.save();
                ctx.fillStyle = 'rgba(16, 185, 129, 0.95)';
                ctx.shadowColor = '#10b981';
                ctx.shadowBlur = 12;
                
                const bw = 220, bh = 34;
                const bx = (w - bw) / 2;
                const by = h - bh - 16;

                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 12);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px "Noto Sans TC", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('// 永不相交 (平行線)', w / 2, by + bh / 2);
                ctx.restore();
            }
        }

        // Launch Game on Window Load
        window.onload = () => {
            new Game();
        };
    </script>
</body>
</html>
